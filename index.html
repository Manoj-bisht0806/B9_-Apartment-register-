<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B9 Chauhan Apartment-03 - Expense Register</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Sample Data Setup
    const initialCollections = [
      { id: 'A101', name: 'Rajesh Sharma', fee: 1000, date: '05-Sep-2026', status: 'Paid', mode: 'UPI' },
      { id: 'A102', name: 'Sunita Verma', fee: 1000, date: '-', status: 'Pending', mode: '-' },
      { id: 'A103', name: 'Amit Singh', fee: 1000, date: '03-Sep-2026', status: 'Paid', mode: 'Cash' },
      { id: 'A104', name: 'Pooja Gupta', fee: 1000, date: '02-Sep-2026', status: 'Paid', mode: 'Bank Transfer' },
      { id: 'A105', name: 'Sandeep Yadav', fee: 1000, date: '-', status: 'Pending', mode: '-' },
      { id: 'B101', name: 'Neha Tiwari', fee: 1000, date: '04-Sep-2026', status: 'Paid', mode: 'UPI' },
    ];

    const initialExpenses = [
      { id: 1, date: '10-Sep-2026', month: 'Sep 26', category: 'Cleaning', desc: 'Gutter Cleaning', amount: 2700, paidTo: 'Local Vendor' },
      { id: 2, date: '05-Sep-2026', month: 'Sep 26', category: 'Lift', desc: 'Lift AMC', amount: 5500, paidTo: 'Lift Service' },
      { id: 3, date: '02-Sep-2026', month: 'Sep 26', category: 'Electricity', desc: 'Common Electricity', amount: 3850, paidTo: 'Electricity Board' },
      { id: 4, date: '28-Aug-2026', month: 'Aug 26', category: 'Garbage', desc: 'Garbage Collection', amount: 2000, paidTo: 'Hari Om' },
      { id: 5, date: '25-Aug-2026', month: 'Aug 26', category: 'Repair', desc: 'Water Tank Repair', amount: 4200, paidTo: 'R.K. Plumber' },
      { id: 6, date: '20-Aug-2026', month: 'Aug 26', category: 'CCTV', desc: 'CCTV Maintenance', amount: 3500, paidTo: 'Security Tech' },
    ];

    const ficSummary = [
      { floor: 'Ground Floor', fic: 'Rajesh Sharma', collection: 18000, pending: 2000, expense: 8500, balance: 7500 },
      { floor: '1st Floor', fic: 'Sunita Verma', collection: 17000, pending: 3000, expense: 7800, balance: 6200 },
      { floor: '2nd Floor', fic: 'Amit Singh', collection: 16000, pending: 3500, expense: 8200, balance: 4300 },
      { floor: '3rd Floor', fic: 'Pooja Gupta', collection: 15000, pending: 4000, expense: 7600, balance: 3400 },
      { floor: '4th Floor', fic: 'Sandeep Yadav', collection: 14000, pending: 3500, expense: 7800, balance: 2700 },
      { floor: '5th Floor', fic: 'Neha Tiwari', collection: 13000, pending: 3000, expense: 7100, balance: 2900 },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('Dashboard');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [expenses, setExpenses] = useState(initialExpenses);

      const [newExpense, setNewExpense] = useState({
        date: '2026-09-10', month: 'Sep 2026', category: 'Cleaning', amount: '', paidTo: '', desc: '', paymentMode: 'Cash'
      });

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, isModalOpen]);

      const handleAddExpense = (e) => {
        e.preventDefault();
        setExpenses([{ id: Date.now(), ...newExpense, amount: Number(newExpense.amount) }, ...expenses]);
        setIsModalOpen(false);
        setNewExpense({ date: '2026-09-10', month: 'Sep 2026', category: 'Cleaning', amount: '', paidTo: '', desc: '', paymentMode: 'Cash' });
      };

      return (
        <div className="flex h-screen bg-slate-100 overflow-hidden font-sans">
          {/* Sidebar */}
          <div className="w-64 bg-slate-900 text-white flex flex-col justify-between p-4">
            <div>
              <div className="flex items-center gap-3 mb-8 px-2">
                <div className="bg-blue-600 p-2 rounded-lg">
                  <i data-lucide="building-2" className="w-5 h-5 text-white"></i>
                </div>
                <div>
                  <h1 className="font-bold text-sm leading-tight">B9 Chauhan Apartment-03</h1>
                  <p className="text-xs text-slate-400">Expense Register</p>
                </div>
              </div>

              <nav className="space-y-1">
                {[
                  { name: 'Dashboard', icon: 'layout-dashboard' },
                  { name: 'Collection', icon: 'receipt' },
                  { name: 'Expenses', icon: 'circle-dollar-sign' },
                  { name: 'FIC Wise', icon: 'users' },
                  { name: 'Reports', icon: 'bar-chart-3' },
                  { name: 'Admin', icon: 'settings' },
                ].map((item) => (
                  <button
                    key={item.name}
                    onClick={() => setActiveTab(item.name)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                      activeTab === item.name ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <i data-lucide={item.icon} className="w-4 h-4"></i>
                    {item.name}
                  </button>
                ))}
              </nav>
            </div>

            <div className="text-xs text-slate-500 text-center py-2 border-t border-slate-800">
              Status: Active | Sep 2026
            </div>
          </div>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col overflow-y-auto">
            <header className="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10">
              <h2 className="text-xl font-bold text-slate-800">{activeTab}</h2>
              <div className="flex items-center gap-4">
                <select className="border rounded-md px-3 py-1.5 text-sm bg-slate-50 font-medium">
                  <option>Sep 2026</option>
                  <option>Aug 2026</option>
                </select>
                <div className="flex items-center gap-2 border-l pl-4">
                  <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 font-bold flex items-center justify-center text-xs">
                    AD
                  </div>
                  <span className="text-sm font-medium text-slate-700">Admin</span>
                </div>
              </div>
            </header>

            <div className="p-6 space-y-6">
              {activeTab === 'Dashboard' && (
                <>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <StatCard title="Total Collection" amount="₹ 1,15,000" badge="Apr - Sep 2026" badgeBg="bg-emerald-50 text-emerald-600" color="bg-emerald-500" />
                    <StatCard title="Total Expenses" amount="₹ 90,755" badge="Apr - Sep 2026" badgeBg="bg-rose-50 text-rose-600" color="bg-rose-500" />
                    <StatCard title="Current Balance" amount="₹ 24,245" badge="Apr - Sep 2026" badgeBg="bg-blue-50 text-blue-600" color="bg-blue-500" />
                    <StatCard title="Reserve Fund" amount="₹ 43,527" badge="Available" badgeBg="bg-purple-50 text-purple-600" color="bg-purple-500" />
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                    <MiniCard title="Total Flats" value="26" color="bg-blue-50 text-blue-700 border-blue-200" />
                    <MiniCard title="Paid Flats" value="18" color="bg-emerald-50 text-emerald-700 border-emerald-200" />
                    <MiniCard title="Pending Flats" value="8" color="bg-rose-50 text-rose-700 border-rose-200" />
                    <MiniCard title="Collection %" value="69%" color="bg-amber-50 text-amber-700 border-amber-200" />
                    <MiniCard title="Expense %" value="79%" color="bg-cyan-50 text-cyan-700 border-cyan-200" />
                  </div>
                </>
              )}

              {activeTab === 'Collection' && (
                <div className="bg-white rounded-xl border shadow-sm p-5 space-y-4">
                  <h3 className="font-bold text-slate-800">Maintenance Collection Register</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-50 border-y text-slate-600">
                        <tr>
                          <th className="py-3 px-4">Flat No.</th>
                          <th className="py-3 px-4">Resident Name</th>
                          <th className="py-3 px-4">Monthly Fee</th>
                          <th className="py-3 px-4">Paid Date</th>
                          <th className="py-3 px-4">Status</th>
                          <th className="py-3 px-4">Payment Mode</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {initialCollections.map((col) => (
                          <tr key={col.id} className="hover:bg-slate-50">
                            <td className="py-3 px-4 font-semibold">{col.id}</td>
                            <td className="py-3 px-4">{col.name}</td>
                            <td className="py-3 px-4">₹{col.fee}</td>
                            <td className="py-3 px-4">{col.date}</td>
                            <td className="py-3 px-4">
                              <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${col.status === 'Paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                {col.status}
                              </span>
                            </td>
                            <td className="py-3 px-4">{col.mode}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeTab === 'Expenses' && (
                <div className="bg-white rounded-xl border shadow-sm p-5 space-y-4">
                  <div className="flex justify-between items-center">
                    <input type="text" placeholder="Search description..." className="border rounded-lg px-3 py-1.5 text-sm w-64" />
                    <button onClick={() => setIsModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
                      <i data-lucide="plus" className="w-4 h-4"></i> Add Expense
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-50 border-y text-slate-600">
                        <tr>
                          <th className="py-3 px-4">Date</th>
                          <th className="py-3 px-4">Month</th>
                          <th className="py-3 px-4">Category</th>
                          <th className="py-3 px-4">Description</th>
                          <th className="py-3 px-4">Amount</th>
                          <th className="py-3 px-4">Paid To</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {expenses.map((exp) => (
                          <tr key={exp.id} className="hover:bg-slate-50">
                            <td className="py-3 px-4">{exp.date}</td>
                            <td className="py-3 px-4">{exp.month}</td>
                            <td className="py-3 px-4">
                              <span className="px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-100 text-purple-700">{exp.category}</span>
                            </td>
                            <td className="py-3 px-4 font-medium">{exp.desc}</td>
                            <td className="py-3 px-4 font-bold text-slate-800">₹{exp.amount.toLocaleString('en-IN')}</td>
                            <td className="py-3 px-4">{exp.paidTo}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeTab === 'FIC Wise' && (
                <div className="bg-white rounded-xl border shadow-sm p-5">
                  <h3 className="font-bold text-slate-800 mb-4">Floor In-Charge (FIC) Summary</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-50 border-y text-slate-600">
                        <tr>
                          <th className="py-3 px-4">Floor</th>
                          <th className="py-3 px-4">FIC Name</th>
                          <th className="py-3 px-4">Collection</th>
                          <th className="py-3 px-4">Pending</th>
                          <th className="py-3 px-4">Expense</th>
                          <th className="py-3 px-4">Balance</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {ficSummary.map((item, idx) => (
                          <tr key={idx} className="hover:bg-slate-50">
                            <td className="py-3 px-4 font-medium">{item.floor}</td>
                            <td className="py-3 px-4">{item.fic}</td>
                            <td className="py-3 px-4 text-emerald-600 font-semibold">₹{item.collection.toLocaleString('en-IN')}</td>
                            <td className="py-3 px-4 text-rose-600 font-semibold">₹{item.pending.toLocaleString('en-IN')}</td>
                            <td className="py-3 px-4 text-slate-700">₹{item.expense.toLocaleString('en-IN')}</td>
                            <td className="py-3 px-4 font-bold text-blue-600">₹{item.balance.toLocaleString('en-IN')}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
              <div className="bg-white w-full max-w-lg rounded-xl shadow-lg p-6 relative">
                <div className="flex justify-between items-center border-b pb-3 mb-4">
                  <h3 className="font-bold text-slate-800">Add New Expense</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <form onSubmit={handleAddExpense} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs font-semibold text-slate-600">Date *</label>
                      <input type="date" required value={newExpense.date} onChange={e => setNewExpense({...newExpense, date: e.target.value})} className="w-full border rounded-lg p-2 text-sm mt-1" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-600">Category *</label>
                      <select value={newExpense.category} onChange={e => setNewExpense({...newExpense, category: e.target.value})} className="w-full border rounded-lg p-2 text-sm mt-1">
                        <option>Cleaning</option>
                        <option>Lift</option>
                        <option>Electricity</option>
                        <option>Garbage</option>
                        <option>Repair</option>
                        <option>CCTV</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs font-semibold text-slate-600">Amount *</label>
                      <input type="number" required placeholder="2700" value={newExpense.amount} onChange={e => setNewExpense({...newExpense, amount: e.target.value})} className="w-full border rounded-lg p-2 text-sm mt-1" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-600">Paid To *</label>
                      <input type="text" required placeholder="Local Vendor" value={newExpense.paidTo} onChange={e => setNewExpense({...newExpense, paidTo: e.target.value})} className="w-full border rounded-lg p-2 text-sm mt-1" />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-600">Description *</label>
                    <input type="text" required placeholder="Gutter Cleaning" value={newExpense.desc} onChange={e => setNewExpense({...newExpense, desc: e.target.value})} className="w-full border rounded-lg p-2 text-sm mt-1" />
                  </div>

                  <div className="flex justify-end gap-3 border-t pt-4">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">Save Expense</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    function StatCard({ title, amount, badge, badgeBg, color }) {
      return (
        <div className="bg-white p-4 rounded-xl border shadow-sm relative overflow-hidden">
          <div className={`absolute top-0 left-0 w-1 h-full ${color}`}></div>
          <p className="text-xs font-medium text-slate-500">{title}</p>
          <h3 className="text-xl font-bold text-slate-800 mt-1">{amount}</h3>
          <span className={`inline-block text-[10px] font-semibold px-2 py-0.5 rounded-full mt-2 ${badgeBg}`}>{badge}</span>
        </div>
      );
    }

    function MiniCard({ title, value, color }) {
      return (
        <div className={`p-3 rounded-lg border flex justify-between items-center ${color}`}>
          <span className="text-xs font-medium">{title}</span>
          <span className="text-lg font-bold">{value}</span>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
